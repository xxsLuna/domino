name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: domino-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: domino-web
          path: dist-web/

  # Android: the web build in the Capacitor shell. Signed with the release key
  # from repository secrets when configured; otherwise a debug-signed APK
  # (installable, but each new key requires uninstalling the previous build).
  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the release signing certificate (public); release APKs must match it.
      ANDROID_CERT_SHA256: 950e63ed12f4764f94627aeacfa936444f368e9e4cdf9e92273dfd5d9c1b5cb4
      # Not a secret: as one, GitHub would mask the word everywhere in the logs.
      DOMINO_KEY_ALIAS: domino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DOMINO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DOMINO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export DOMINO_KEYSTORE="$RUNNER_TEMP/release.keystore"
            ./gradlew --no-daemon assembleRelease
            ls -l app/build/outputs/apk/release/
            APK=app/build/outputs/apk/release/app-release.apk
            APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
            if ! CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
              echo "$CERTS"
              echo "::error::apksigner could not verify the release APK"
              exit 1
            fi
            echo "$CERTS"
            DIGEST=$(echo "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "APK signing certificate SHA-256: $DIGEST"
            if [ "$DIGEST" != "$ANDROID_CERT_SHA256" ]; then
              echo "::error::release APK is not signed with the domino release key"
              exit 1
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; publishing a debug-signed APK"
            ./gradlew --no-daemon assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$APK" "../release/domino-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: domino-android
          path: release/*.apk
          if-no-files-found: error

  # Publish the installers as a GitHub Release, one per package.json version.
  # A version that already has a release is left untouched — bump the version
  # to ship a new one, so a tag always matches the commit its files came from.
  release:
    needs: [build, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: domino-mac
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: domino-win
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: domino-linux
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: domino-android
          path: dist-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump package.json version to publish a new one."
            exit 0
          fi
          shopt -s nullglob
          FILES=(dist-release/*.dmg dist-release/*.zip dist-release/*.exe dist-release/*.AppImage dist-release/*.deb dist-release/*.apk)
          ls -l "${FILES[@]}"
          gh release create "$TAG" "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --title "domino $VERSION" \
            --generate-notes
