name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: domino-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: domino-web
          path: dist-web/

  # Publish the installers as a GitHub Release, one per package.json version.
  # A version that already has a release is left untouched — bump the version
  # to ship a new one, so a tag always matches the commit its files came from.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: domino-mac
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: domino-win
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          name: domino-linux
          path: dist-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump package.json version to publish a new one."
            exit 0
          fi
          shopt -s nullglob
          FILES=(dist-release/*.dmg dist-release/*.zip dist-release/*.exe dist-release/*.AppImage dist-release/*.deb)
          ls -l "${FILES[@]}"
          gh release create "$TAG" "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --title "domino $VERSION" \
            --generate-notes
